[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-analyst"
version = "1.1.0"
description = "Conversation Analyst: multimodal measurement of dyadic conversation from per-person video"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexander Mueller", email = "admueller3@wisc.edu" }]
keywords = ["conversation analysis", "turn-taking", "multimodal", "psychology", "dyadic"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "av>=11.0",
    "opencv-python>=4.8",
    "onnxruntime>=1.16",
    "mediapipe>=0.10",
    "faster-whisper>=1.0",
    "praat-parselmouth>=0.4.3",
    "soundfile>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2", "torch>=2.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
conversation-analyst = "conversation_analyst.cli:main"
# Kept for one release so nothing that learned the old name breaks.
convlab = "conversation_analyst.cli:main"

[project.gui-scripts]
conversation-analyst-gui = "conversation_analyst.gui:main"
# A gui-script rather than a console script: on Windows this produces a
# launcher that opens no console window, so double-clicking the app does not
# leave a black terminal sitting behind it.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conversation_analyst = ["resources/*.json", "resources/*.txt", "report/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: tests that download models or decode media",
    "needs_models: tests requiring fetched model assets",
]
